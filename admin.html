<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fish Joy 管理控制台</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#26364e;--muted:#91a2bb;--text:#edf4ff;--blue:#55a8ff;--green:#42d6a0;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#172c49 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:#061326;font-weight:700;cursor:pointer}button.secondary{background:#26364e;color:var(--text)}button:disabled{opacity:.55;cursor:wait}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(18px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:#0b1220cc;position:sticky;top:0;backdrop-filter:blur(14px);z-index:2}
.brand{font-size:18px;font-weight:800;letter-spacing:.3px}.brand span{color:var(--blue)}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}
.panel{background:linear-gradient(145deg,#142239,#101a2b);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 16px 50px #0003}
.login{max-width:420px;margin:9vh auto}.login h1{margin:0 0 6px;font-size:24px}.muted{color:var(--muted)}label{display:block;color:#c4d2e5;font-size:13px;margin:15px 0 7px}
input,textarea{width:100%;border:1px solid var(--line);background:#091321;color:var(--text);border-radius:10px;padding:12px;outline:none}input:focus,textarea:focus{border-color:var(--blue)}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}.toolbar input{max-width:360px}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#0c1728;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:140px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px;margin-top:16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:600}td{font-size:14px}.playername{font-weight:700}.id{font-size:11px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.editor h2,.listhead h2{font-size:17px;margin:0}.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.editor textarea{min-height:360px;resize:vertical;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.editor-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.notice{padding:10px 12px;border-radius:10px;background:#13243a;color:#b9d7f7;margin-top:12px;font-size:13px}.notice.error{background:#351c27;color:#ffb4b4}.notice.ok{background:#123328;color:#a6f2d5}
.empty{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr}.wrap{margin:18px auto}.editor textarea{min-height:280px}header{padding:14px 18px}}
</style>
</head>
<body>
<header><div class="brand"><span>FISH</span> JOY <span style="color:#91a2bb;font-weight:500">/ 管理控制台</span></div><div class="row"><span id="adminState" class="muted" style="font-size:12px">未登录</span><button id="logoutBtn" class="secondary hidden">退出登录</button></div></header>
<main class="wrap">
<section id="loginPanel" class="panel login">
<h1>管理员登录</h1><div class="muted">独立管理入口 · 仅授权管理员可访问</div>
<form id="loginForm"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" placeholder="输入 Cloudflare 中设置的管理员密码" required><div style="margin-top:16px"><button id="loginBtn" type="submit" style="width:100%">安全登录</button></div></form>
<div id="loginNotice" class="notice hidden"></div>
</section>
<section id="dashboard" class="hidden">
<div class="stats"><div class="stat"><b id="playerCount">—</b><small>当前查询结果</small></div><div class="stat"><b>Cloudflare D1</b><small>在线玩家数据库</small></div><div class="stat"><b>只编辑存档</b><small>不触碰密码与登录会话</small></div></div>
<div class="toolbar"><input id="searchInput" type="search" placeholder="搜索玩家昵称或账号 ID"><button id="searchBtn">搜索</button><button id="refreshBtn" class="secondary">刷新列表</button></div>
<div class="layout">
<section class="panel"><div class="listhead"><h2>玩家列表</h2><span class="muted" style="font-size:12px">最多显示 200 个账号</span></div><div class="tablewrap"><table><thead><tr><th>玩家</th><th>金币</th><th>炮台等级</th><th>存档更新时间</th><th>操作</th></tr></thead><tbody id="playersBody"><tr><td colspan="5" class="empty">正在读取玩家数据…</td></tr></tbody></table></div></section>
<section class="panel editor"><div class="listhead"><h2>玩家存档编辑</h2><span id="selectedName" class="muted" style="font-size:12px">尚未选择玩家</span></div>
<div id="editorHint" class="notice">请先从左侧选择一个玩家。编辑器会载入该玩家完整 JSON 存档。</div>
<div id="editorArea" class="hidden"><div class="muted" id="playerMeta" style="font-size:12px;margin:12px 0"></div><label for="saveJson">完整存档 JSON</label><textarea id="saveJson" spellcheck="false"></textarea><div class="editor-actions"><button id="saveBtn">保存修改</button><button id="reloadBtn" class="secondary">重新载入</button></div><div class="notice">保存前请确认 JSON 格式正确。只更新该玩家的游戏存档，不会修改账号密码或登录会话。</div></div>
<div id="editorNotice" class="notice hidden"></div>
</section>
</div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
let selectedId = "";
async function api(path, options={}) {
  const response = await fetch(path, { credentials:"same-origin", ...options, headers:{"Content-Type":"application/json",...(options.headers||{})} });
  const data = await response.json().catch(()=>({error:"服务器返回了无法识别的数据"}));
  if (!response.ok) throw new Error(data.error || ("请求失败："+response.status));
  return data;
}
function notice(el, message, type="") { el.textContent=message; el.className="notice"+(type?" "+type:""); el.classList.remove("hidden"); }
function dateText(value) { if(!value)return "—"; const d=new Date(Number(value)*1000); return Number.isNaN(d.getTime())?"—":d.toLocaleString(); }
function cell(text, className="") { const td=document.createElement("td"); td.textContent=text; if(className)td.className=className; return td; }
async function loadPlayers() {
  const q=$("searchInput").value.trim();
  $("playersBody").replaceChildren();
  const loading=document.createElement("tr"); const loadingCell=cell("正在读取…"); loadingCell.colSpan=5; loadingCell.className="empty"; loading.append(loadingCell); $("playersBody").append(loading);
  try {
    const data=await api("/api/admin/players?q="+encodeURIComponent(q));
    $("playerCount").textContent=data.count;
    $("playersBody").replaceChildren();
    if(!data.players.length){const tr=document.createElement("tr");const td=cell("没有找到玩家");td.colSpan=5;td.className="empty";tr.append(td);$("playersBody").append(tr);return;}
    for(const p of data.players){
      const tr=document.createElement("tr");
      const name=document.createElement("td");const strong=document.createElement("div");strong.className="playername";strong.textContent=p.username;const id=document.createElement("div");id.className="id";id.textContent=p.id;name.append(strong,id);tr.append(name);
      tr.append(cell(Number(p.coins).toLocaleString()),cell(String(p.cannonLevel||0)),cell(dateText(p.updatedAt)));
      const action=cell("");const btn=document.createElement("button");btn.textContent="编辑";btn.addEventListener("click",()=>loadPlayer(p.id));action.append(btn);tr.append(action);$("playersBody").append(tr);
    }
  } catch(e) { const tr=document.createElement("tr");const td=cell(e.message);td.colSpan=5;td.className="empty";tr.append(td);$("playersBody").append(tr); }
}
async function loadPlayer(id) {
  try {
    const data=await api("/api/admin/player?id="+encodeURIComponent(id));
    selectedId=data.player.id;$("selectedName").textContent=data.player.username;
    $("playerMeta").textContent="账号 ID："+data.player.id+" · 注册时间："+dateText(data.player.createdAt)+" · 存档更新时间："+dateText(data.player.updatedAt);
    $("saveJson").value=JSON.stringify(data.save,null,2);
    $("editorHint").classList.add("hidden");$("editorArea").classList.remove("hidden");$("editorNotice").classList.add("hidden");
  } catch(e) { notice($("editorNotice"),e.message,"error"); }
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("loginBtn").disabled=true;
  try { await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});$("password").value="";await showDashboard(); }
  catch(err){notice($("loginNotice"),err.message,"error");}
  finally{$("loginBtn").disabled=false;}
});
async function showDashboard(){
  $("loginPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");$("adminState").textContent="管理员已验证";await loadPlayers();
}
async function checkSession(){
  try{await api("/api/admin/status");await showDashboard();}
  catch(_){$("loginPanel").classList.remove("hidden");$("dashboard").classList.add("hidden");$("logoutBtn").classList.add("hidden");$("adminState").textContent="未登录";}
}
$("searchBtn").addEventListener("click",loadPlayers);$("refreshBtn").addEventListener("click",loadPlayers);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")loadPlayers();});
$("reloadBtn").addEventListener("click",()=>selectedId&&loadPlayer(selectedId));
$("saveBtn").addEventListener("click",async()=>{
  if(!selectedId)return;
  let save;try{save=JSON.parse($("saveJson").value);}catch(e){notice($("editorNotice"),"JSON 格式错误："+e.message,"error");return;}
  $("saveBtn").disabled=true;
  try{await api("/api/admin/player",{method:"PUT",body:JSON.stringify({id:selectedId,save})});notice($("editorNotice"),"保存成功。数据库存档已更新。","ok");await loadPlayers();}
  catch(e){notice($("editorNotice"),e.message,"error");}
  finally{$("saveBtn").disabled=false;}
});
$("logoutBtn").addEventListener("click",async()=>{try{await api("/api/admin/logout",{method:"POST"});}catch(_){}location.reload();});
checkSession();
</script>
</body>
</html>
